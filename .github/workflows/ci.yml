name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  # Release pushes the version commit with GITHUB_TOKEN, which does not
  # start this workflow. Dispatch is how to test that SHA by hand.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      - name: Run tests
        # No glob: PowerShell is the default shell on Windows runners and does
        # not expand one, so the pattern reached node as a literal path.
        # Node discovers **/*.test.mjs itself when given no paths.
        working-directory: packages/core
        run: node --test

      - name: Run script tests
        # Explicit path: same PowerShell glob trap as above.
        run: node --test scripts/sync-plugin-versions.test.mjs

  wasm:
    name: Wasm plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Last-commit-per-path needs parents. Depth 1 reports HEAD for every
          # file in the tree, so a forgotten wasm rebuild would look current.
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Compile the plugin
        run: cargo build --package zswarm-events --release --target wasm32-wasip1

      - name: Fail if the crate moved without a wasm rebuild
        # Byte-identical cmp is not portable: rustc on ubuntu-latest does not
        # emit the same wasm as a macOS rebuild (observed differ at byte 18).
        # The crate's last commit must be an ancestor of the committed artifact.
        run: |
          src=$(git log -1 --format=%H -- crates/zswarm-events Cargo.lock Cargo.toml)
          wasm=$(git log -1 --format=%H -- packages/wasm/zswarm-bus-v3.wasm)
          if ! git merge-base --is-ancestor "$src" "$wasm"; then
            echo "crates/zswarm-events last changed in $src"
            echo "packages/wasm/zswarm-bus-v3.wasm last changed in $wasm"
            echo "Rebuild with: pnpm build:plugin"
            exit 1
          fi
