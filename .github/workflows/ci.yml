name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      - name: Run tests
        # No glob: PowerShell is the default shell on Windows runners and does
        # not expand one, so the pattern reached node as a literal path.
        # Node discovers **/*.test.mjs itself when given no paths.
        working-directory: packages/core
        run: node --test

      - name: Run script tests
        # Explicit path: same PowerShell glob trap as above.
        run: node --test scripts/sync-plugin-versions.test.mjs

  wasm:
    name: Wasm plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Check the event-bus crate
        run: cargo check --package zswarm-events --target wasm32-wasip1
