name: Release

# Publish only after CI has succeeded for a push to master. PR CI must not
# publish. workflow_run runs on the default branch, so checkout the SHA that
# actually passed — not whatever master is by the time this job starts.
#
# GITHUB_TOKEN version commits still do not retrigger CI, so they cannot
# loop this workflow either. That is fine: those commits only touch
# manifests, changelogs, and plugin.json.
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  release:
    name: Version and publish
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'master'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # changesets 3.x calls module.enableCompileCache(), added in Node 22.
          node-version: 22
          cache: pnpm
          # Writes an .npmrc that reads NODE_AUTH_TOKEN; without it a publish
          # fails with ENEEDAUTH even though the token is in the environment.
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      - name: Version, publish, and push in one cycle
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # One scripted cycle, no Version PR: consume pending changesets,
          # publish, then push the version commit and tags back to master.
          if find .changeset -name '*.md' ! -name 'README.md' | grep -q .; then
            pnpm version-packages
          fi
          # version-packages already syncs plugin.json when changesets exist.
          # Run it again so a re-run still catches manifests that lagged a
          # previous npm-only release.
          node scripts/sync-plugin-versions.mjs
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(release): version packages"
          fi
          # Push the version commit before npm mutate. Publishing first left
          # packages on the registry when a later master push made this SHA
          # non-fast-forward, and a failing follow-up CI never repaired git.
          git fetch origin master
          master=$(git rev-parse origin/master)
          head=$(git rev-parse HEAD)
          if [ "$master" != "$head" ]; then
            parent=$(git rev-parse HEAD^)
            if [ "$master" != "$parent" ]; then
              echo "origin/master moved past this SHA; skipping publish"
              echo "master=$master head=$head"
              exit 0
            fi
            git push --follow-tags origin HEAD:master
          fi
          # Publishes anything whose version is not on npm yet; a re-run after
          # a successful push therefore recovers a failed publish.
          pnpm release
