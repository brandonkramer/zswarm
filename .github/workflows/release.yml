name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # changesets 3.x calls module.enableCompileCache(), added in Node 22.
          node-version: 22
          cache: pnpm
          # Writes an .npmrc that reads NODE_AUTH_TOKEN; without it a publish
          # fails with ENEEDAUTH even though the token is in the environment.
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      - name: Version, publish, and push in one cycle
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # One scripted cycle, no Version PR: consume pending changesets,
          # publish, then push the version commit and tags back to master.
          # Pushes made with GITHUB_TOKEN do not trigger workflows, so this
          # cannot loop — it also means the version commit gets no CI run,
          # which is fine: it only touches manifests, changelogs, and plugin.json.
          if find .changeset -name '*.md' ! -name 'README.md' | grep -q .; then
            pnpm version-packages
          fi
          # version-packages already syncs plugin.json when changesets exist.
          # Run it again so a re-run still catches manifests that lagged a
          # previous npm-only release.
          node scripts/sync-plugin-versions.mjs
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(release): version packages"
          fi
          # Publishes anything whose version is not on npm yet; a re-run after
          # a failed push therefore recovers instead of double-publishing.
          pnpm release
          git push --follow-tags
